name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout check (required files, abstract, no public grade)
        run: python tests/test_smoke.py
      - name: Learn unit tests
        run: python -m unittest tests.test_learn_guardrails -v
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build unit tests
        run: python -m unittest tests.test_build_harness -v
      - name: Build runner
        run: python level-2-build/run_build.py
      - name: Deep unit tests
        run: python -m unittest tests.test_deep_classifier -v
      - name: Deep runner
        run: python level-3-deep/run_deep.py
      - name: Rigor unit tests
        run: python -m unittest tests.test_rigor -v
      - name: Rigor runner (intervals, paired tests, baselines, ablation)
        run: python level-3-deep/rigor.py
      - name: committed results are reproduced byte for byte
        run: |
          git diff --exit-code -- level-1-learn/results_learn.json level-2-build/results_build.json \
            level-3-deep/results_deep.json level-3-deep/results_rigor.json
      - name: one-command reproduce (the README's documented command)
        run: sh scripts/reproduce.sh
